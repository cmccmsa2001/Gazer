<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gaze Reader</title>
<style>
:root{--bg:#faf8f3;--ink:#1d1b18;--mute:#8a857c;--acc:#d2492a;--hud:rgba(29,27,24,.88)}
@media(prefers-color-scheme:dark){:root{--bg:#16150f;--ink:#e9e4d8;--mute:#8a857c;--hud:rgba(0,0,0,.85)}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,system-ui,sans-serif;overflow:hidden}
#bar{position:fixed;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top) + 6px) 10px 6px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;background:var(--bg);border-bottom:1px solid rgba(128,128,128,.25);z-index:5}
#bar.hidden{transform:translateY(-100%)}
button,label.btn{font:inherit;font-size:14px;padding:8px 11px;border-radius:9px;border:1px solid rgba(128,128,128,.4);background:transparent;color:var(--ink);min-height:38px}
button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
input[type=file]{display:none}
#reader{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top) + 58px);bottom:calc(env(safe-area-inset-bottom) + 64px);padding:0 14px}
.tap{position:fixed;top:30%;bottom:80px;width:22%;z-index:3}
#tapL{left:0}#tapR{right:0}
#hud{position:fixed;left:0;right:0;bottom:0;padding:8px 12px calc(env(safe-area-inset-bottom) + 8px);background:var(--hud);color:#eee;font-size:13px;z-index:4;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
#gz{flex:1 1 120px;height:8px;background:#444;border-radius:4px;position:relative;min-width:100px}
#gzDot{position:absolute;top:-3px;width:14px;height:14px;border-radius:50%;background:var(--acc);transform:translateX(-50%);left:50%}
#cal{position:fixed;inset:0;background:var(--bg);z-index:10;display:none;align-items:center;justify-content:center;text-align:center;padding:20px}
#calDot{position:fixed;width:26px;height:26px;border-radius:50%;background:var(--acc);top:45%;display:none}
#empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--mute);padding:24px}
video{position:fixed;width:1px;height:1px;opacity:0;pointer-events:none}
#sens{width:90px}
</style>
</head>
<body>
<div id="bar">
  <label class="btn">Open EPUB<input id="file" type="file" accept=".epub,application/epub+zip"></label>
  <button id="camBtn">Start camera</button>
  <button id="calBtn" disabled>Calibrate</button>
  <button id="modeBtn" disabled>Mode: learn</button>
  <button id="fontDn">A−</button><button id="fontUp">A+</button>
  <label style="font-size:13px">Sens <input id="sens" type="range" min="0.2" max="0.8" step="0.05" value="0.45"></label>
  <button id="hideBtn">Hide</button>
</div>
<div id="reader"><div id="empty">Open an EPUB to start.<br><br>Then: Start camera → Calibrate → turn 3 pages by tapping the right edge so it learns your page length → it switches to auto.</div></div>
<div class="tap" id="tapL"></div><div class="tap" id="tapR"></div>
<div id="hud">
  <span id="st">Idle</span>
  <span>Lines <b id="ln">0</b>/<b id="tg">–</b></span>
  <span><b id="lpm">–</b> lines/min</span>
  <div id="gz"><div id="gzDot"></div></div>
</div>
<div id="cal"><div id="calMsg">Hold the phone where you normally read.</div></div>
<div id="calDot"></div>
<video id="vid" playsinline muted autoplay></video>

<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/epubjs@0.3.93/dist/epub.min.js"></script>
<script type="module">
import {FaceLandmarker, FilesetResolver} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";
const $ = id => document.getElementById(id);
const S = {
  book:null, rend:null, font:19,
  lm:null, running:false, lastVideoT:-1,
  g:null,                 // smoothed raw gaze ratio
  L:null, R:null,         // calibration means
  hist:[],                // [{t,n}] normalized gaze, recent
  lastSweep:0, sweepTimes:[],
  lines:0, learned:[], mode:'learn', target:null,
  faceSeen:0, turnTimer:null, wake:null
};
const store = {get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const cfg = store.get('gr-cfg'); if(cfg){S.font=cfg.font||19; if(cfg.L!=null){S.L=cfg.L;S.R=cfg.R}}
const status = t => $('st').textContent = t;

/* ---------- EPUB ---------- */
$('file').onchange = async e => {
  const f = e.target.files[0]; if(!f) return;
  $('empty')?.remove();
  if(S.rend){S.rend.destroy();}
  const buf = await f.arrayBuffer();
  S.book = ePub(buf); S.bookKey = 'gr-loc-' + f.name;
  S.rend = S.book.renderTo('reader',{width:'100%',height:'100%',flow:'paginated',spread:'none'});
  applyFont();
  await S.rend.display(store.get(S.bookKey) || undefined);
  S.rend.on('relocated', loc => store.set(S.bookKey, loc.start.cfi));
  status('Book loaded');
};
function applyFont(){
  if(!S.rend) return;
  S.rend.themes.default({body:{'font-size':S.font+'px !important','line-height':'1.55 !important'}});
  S.rend.themes.fontSize(S.font+'px');
  // page length changed: relearn
  S.learned=[]; S.target=null; setMode('learn');
}
$('fontUp').onclick=()=>{S.font=Math.min(30,S.font+1);applyFont();saveCfg()};
$('fontDn').onclick=()=>{S.font=Math.max(13,S.font-1);applyFont();saveCfg()};
function saveCfg(){store.set('gr-cfg',{font:S.font,L:S.L,R:S.R})}

function turn(dir, manual){
  if(!S.rend) return;
  clearTimeout(S.turnTimer); S.turnTimer=null;
  if(dir>0){
    if(manual && S.mode==='learn' && S.lines>=3){
      S.learned.push(S.lines);
      if(S.learned.length>=3){
        const a=[...S.learned].sort((x,y)=>x-y); S.target=a[Math.floor(a.length/2)];
        setMode('auto');
      }
    }
    S.rend.next();
  } else S.rend.prev();
  S.lines=0; S.ignoreUntil=performance.now()+700; // ignore the jump to top of new page
  render();
}
$('tapR').onclick=()=>turn(1,true);
$('tapL').onclick=()=>turn(-1,true);
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')turn(1,true);if(e.key==='ArrowLeft')turn(-1,true)});

function setMode(m){
  S.mode=m; $('modeBtn').textContent='Mode: '+m; $('modeBtn').classList.toggle('on',m==='auto');
  if(m==='learn') status('Learning: tap right edge to turn ('+S.learned.length+'/3)');
  else status('Auto');
  render();
}
$('modeBtn').onclick=()=>{
  if(S.mode==='learn'){ if(S.target) setMode('auto'); else status('Turn 3 pages manually first'); }
  else setMode('learn');
};
$('hideBtn').onclick=()=>$('bar').classList.toggle('hidden');

/* ---------- Camera + model ---------- */
$('camBtn').onclick = async () => {
  if(S.running) return;
  try{
    status('Loading model…');
    const fs = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
    S.lm = await FaceLandmarker.createFromOptions(fs,{
      baseOptions:{modelAssetPath:"https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",delegate:"GPU"},
      runningMode:"VIDEO", numFaces:1
    });
    const stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:640,height:480},audio:false});
    $('vid').srcObject = stream; await $('vid').play();
    S.running=true; $('camBtn').classList.add('on'); $('camBtn').textContent='Camera on';
    $('calBtn').disabled=false; $('modeBtn').disabled=false;
    try{ S.wake = await navigator.wakeLock?.request('screen'); }catch(e){}
    status(S.L!=null ? 'Ready (using saved calibration)' : 'Camera on: calibrate next');
    requestAnimationFrame(loop);
  }catch(err){ status('Camera/model error: '+err.message); }
};
document.addEventListener('visibilitychange',async()=>{ if(document.visibilityState==='visible'&&S.running){try{S.wake=await navigator.wakeLock?.request('screen')}catch(e){}} });

// Horizontal iris position within each eye, 0 = image-left corner, 1 = image-right corner
function rawGaze(p){
  const r1=(p[468].x-p[33].x)/(p[133].x-p[33].x);
  const r2=(p[473].x-p[362].x)/(p[263].x-p[362].x);
  return (r1+r2)/2;
}
function loop(){
  const v=$('vid'), now=performance.now();
  if(v.readyState>=2 && v.currentTime!==S.lastVideoT){
    S.lastVideoT=v.currentTime;
    const res=S.lm.detectForVideo(v,now);
    const p=res.faceLandmarks?.[0];
    if(p && p.length>473){
      S.faceSeen=now;
      const r=rawGaze(p);
      S.g = S.g==null ? r : S.g*0.5 + r*0.5;
      if(S.calSamples) S.calSamples.push(S.g);
      if(S.L!=null) onGaze((S.g-S.L)/(S.R-S.L), now);
    }
  }
  if(S.running && now-S.faceSeen>1200 && S.mode==='auto'){ status('No face: paused'); clearTimeout(S.turnTimer); S.turnTimer=null; }
  requestAnimationFrame(loop);
}

/* ---------- Line-return detection ---------- */
function onGaze(n, t){
  $('gzDot').style.left = Math.max(0,Math.min(100,n*100))+'%';
  S.hist.push({t,n}); while(S.hist.length && t-S.hist[0].t>400) S.hist.shift();
  if(S.ignoreUntil && t<S.ignoreUntil) return;
  if(t-S.lastSweep<600) return;
  const need=+$('sens').value;
  const peak=Math.max(...S.hist.map(h=>h.n));
  // return sweep: was on the right side recently, now well to the left, quickly
  if(peak>0.55 && n<peak-need && n<0.45){
    S.lastSweep=t; S.hist=[];
    S.sweepTimes.push(t); if(S.sweepTimes.length>12) S.sweepTimes.shift();
    S.lines++;
    if(S.mode==='auto'){ status('Auto'); maybeTurn(); }
    render();
  }
}
function lineInterval(){
  const a=S.sweepTimes; if(a.length<3) return 4000;
  const d=[]; for(let i=1;i<a.length;i++){const x=a[i]-a[i-1]; if(x<15000)d.push(x)}
  d.sort((x,y)=>x-y); return d.length?d[Math.floor(d.length/2)]:4000;
}
function maybeTurn(){
  // after target sweeps you are on the last line: turn after ~one line's time
  if(S.target && S.lines>=S.target && !S.turnTimer){
    S.turnTimer=setTimeout(()=>{S.turnTimer=null; turn(1,false)}, lineInterval()*0.9);
  }
}
function render(){
  $('ln').textContent=S.lines; $('tg').textContent=S.target??'–';
  const iv=lineInterval(); $('lpm').textContent = S.sweepTimes.length>=3 ? Math.round(60000/iv) : '–';
  if(S.mode==='learn' && S.running && S.L!=null) status('Learning: tap right edge to turn ('+S.learned.length+'/3)');
}

/* ---------- Calibration ---------- */
$('calBtn').onclick = async () => {
  const cal=$('cal'), dot=$('calDot'), msg=$('calMsg');
  cal.style.display='flex'; msg.textContent='Hold the phone where you normally read. Look at the dot.';
  await wait(1500);
  const sample = async (side) => {
    dot.style.display='block'; dot.style.left = side==='L' ? '14px' : 'calc(100% - 40px)';
    msg.textContent='Look at the dot. Keep your head still.';
    await wait(700); S.calSamples=[]; await wait(1800);
    const a=S.calSamples.sort((x,y)=>x-y); S.calSamples=null;
    return a[Math.floor(a.length/2)];
  };
  const L1=await sample('L'), R1=await sample('R'), L2=await sample('L'), R2=await sample('R');
  dot.style.display='none';
  const L=(L1+L2)/2, R=(R1+R2)/2;
  if(L==null||R==null||isNaN(L)||Math.abs(R-L)<0.02){
    msg.textContent='Calibration failed (eyes not detected or no movement). Better light, phone a bit closer, try again.';
    await wait(2500); cal.style.display='none'; return;
  }
  S.L=L; S.R=R; saveCfg();   // sign handles mirroring automatically
  msg.textContent='Done.'; await wait(600); cal.style.display='none';
  setMode(S.target?'auto':'learn');
};
const wait = ms => new Promise(r=>setTimeout(r,ms));
</script>
</body>
</html>
